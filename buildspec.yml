
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
      - python -m pip install -r requirements-dev.txt

  pre_build:
    commands:
      - echo "Verificando entorno de pruebas..."
      - python --version

  build:
    commands:
      - echo "Ejecutando pruebas unitarias..."
      - python -m pytest -v

  post_build:
    commands:
      - echo "Pruebas finalizadas."

artifacts:
  files:
    - '**/*'
